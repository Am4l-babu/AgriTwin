# Mosquitto MQTT Broker Configuration
# For Fog Layer (Raspberry Pi Zero 2 W)
# Hostname: agritwin-fog.local
# This file is deployed on the Raspberry Pi, NOT on the laptop.

# ==============================================
# Network Configuration
# ==============================================

# Listen on all interfaces
listener 1883 0.0.0.0
protocol mqtt

# WebSocket support for dashboard
listener 9001
protocol websockets

# ==============================================
# Authentication
# ==============================================

# Disable anonymous access in production
allow_anonymous true

# Password file (optional, for production)
# password_file /etc/mosquitto/passwd

# ==============================================
# Persistence
# ==============================================

# Enable persistence (disabled for now - can be enabled with Windows paths)
persistence false
# persistence_location C:\\mosquitto\\data\\

# Autosave interval (seconds)
autosave_interval 300

# ==============================================
# Logging
# ==============================================

# Log to console only (Windows compatible)
log_dest stdout

log_type error
log_type warning
log_type notice
log_type information

# Connection messages
connection_messages true

# ==============================================
# Quality of Service
# ==============================================

# Maximum QoS level (Note: max_qos_allowed not supported in Mosquitto 2.1.2)
# QoS 0, 1, and 2 are all supported by default

# Message size limit (bytes)
message_size_limit 1048576

# ==============================================
# Performance Tuning
# ==============================================

# Max queued messages per client
max_queued_messages 1000

# Max inflight messages
max_inflight_messages 20

# ==============================================
# Security (for production)
# ==============================================

# Require protocol version MQTT 3.1.1 or 5.0
# protocol_version mqttv311

# TLS/SSL (uncomment for production)
# listener 8883
# protocol mqtt
# cafile /etc/mosquitto/ca_certificates/ca.crt
# certfile /etc/mosquitto/certs/server.crt
# keyfile /etc/mosquitto/certs/server.key
# require_certificate false

# ==============================================
# Topic ACLs (Access Control)
# ==============================================

# ACL file (optional)
# acl_file /etc/mosquitto/acl

# Example ACL rules (create file separately):
# user esp32_farm_001
# topic write farms/farm_001/#
# topic read farms/farm_001/commands/#
#
# user fog_gateway
# topic read farms/#
# topic write farms/+/commands/#
