# =============================================================
# Mosquitto MQTT Broker Configuration
# Target : Raspberry Pi Zero 2 W  (agritwin-fog.local)
# Deploy : /etc/mosquitto/conf.d/agritwin.conf   (on the Pi)
# =============================================================

# -------------------------------------------------------------
# Network — listen on all interfaces on port 1883
# This is required so the ESP32 (on the same WiFi network)
# can reach the broker at agritwin-fog.local:1883
# -------------------------------------------------------------
listener 1883 0.0.0.0
protocol mqtt

# WebSocket listener (optional — used by the dashboard)
listener 9001 0.0.0.0
protocol websockets

# -------------------------------------------------------------
# Authentication
# allow_anonymous true lets the ESP32 connect without a
# username/password.  Fine for a local LAN; for production
# create a password file and set allow_anonymous false.
# -------------------------------------------------------------
allow_anonymous true

# Uncomment the lines below to require authentication:
# allow_anonymous false
# password_file /etc/mosquitto/passwd

# -------------------------------------------------------------
# Persistence — store messages so they survive a broker restart
# -------------------------------------------------------------
persistence true
persistence_location /var/lib/mosquitto/

autosave_interval 300

# -------------------------------------------------------------
# Logging
# -------------------------------------------------------------
log_dest syslog
log_dest stdout

log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Show MQTT client connects/disconnects in the log
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# -------------------------------------------------------------
# Limits
# -------------------------------------------------------------
# Keep-alive tolerance: allow the ESP32's 60-second keepalive
max_keepalive 120

# Maximum in-flight QoS 1/2 messages per client
max_inflight_messages 20

# Maximum queued messages when client is offline
max_queued_messages 100
