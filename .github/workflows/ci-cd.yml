name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # =========================================
  # Linting and Code Quality
  # =========================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, fog]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd cloud/${{ matrix.component }}
          pip install -r requirements.txt
          pip install black flake8 mypy isort
      
      - name: Run Black
        run: |
          cd cloud/${{ matrix.component }}
          black --check .
      
      - name: Run Flake8
        run: |
          cd cloud/${{ matrix.component }}
          flake8 . --max-line-length=120
      
      - name: Run MyPy
        run: |
          cd cloud/${{ matrix.component }}
          mypy . --ignore-missing-imports

  # =========================================
  # Backend Tests
  # =========================================
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          cd cloud/backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      
      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
        run: |
          cd cloud/backend
          pytest tests/ -v --cov --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: cloud/backend/coverage.xml
          flags: backend

  # =========================================
  # Frontend Tests
  # =========================================
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        run: |
          cd cloud/frontend
          npm ci
      
      - name: Run tests
        run: |
          cd cloud/frontend
          npm test -- --coverage
      
      - name: Build
        run: |
          cd cloud/frontend
          npm run build

  # =========================================
  # Edge Firmware Build
  # =========================================
  build-edge:
    name: Build Edge Firmware
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python for PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PlatformIO
        run: |
          pip install platformio
      
      - name: Build firmware
        run: |
          cd edge
          cp configs/config_template.h include/config.h
          pio run

  # =========================================
  # Integration Tests
  # =========================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Start services
        run: |
          docker-compose -f docker/docker-compose.yml up -d
          sleep 30
      
      - name: Run integration tests
        run: |
          cd tests/integration
          pip install -r requirements.txt
          pytest -v
      
      - name: Stop services
        run: docker-compose -f docker/docker-compose.yml down

  # =========================================
  # Build and Push Docker Images
  # =========================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./cloud/backend
          file: ./docker/backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-farming-backend:latest
      
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./cloud/frontend
          file: ./docker/frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smart-farming-frontend:latest

  # =========================================
  # Deploy to Staging
  # =========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - name: Deploy to staging server
        run: |
          echo "Deploying to staging..."
          # Add deployment scripts here

  # =========================================
  # Deploy to Production
  # =========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add deployment scripts here
