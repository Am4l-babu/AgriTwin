# Mosquitto MQTT Broker Configuration
# For Fog Layer (Raspberry Pi Zero 2 W)
# Deploy on the Raspberry Pi at: /etc/mosquitto/conf.d/agritwin.conf
# See fog/README.md for full Raspberry Pi setup instructions.

# Listeners
listener 1883
protocol mqtt

listener 9001
protocol websockets

# Authentication (change for production)
allow_anonymous false
password_file /mosquitto/config/passwd

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true

# Connection limits
max_connections -1
max_queued_messages 1000

# Message size
message_size_limit 0

# QoS
max_qos 2
