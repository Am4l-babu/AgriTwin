;PlatformIO Project Configuration File
;
; Smart Farming Digital Twin - Edge Layer
; ESP32/ESP8266 Firmware Configuration
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include
lib_dir = lib
test_dir = test
data_dir = data

; ========================================
; Common settings for all environments
; ========================================
[common]
lib_deps =
    ; MQTT
    knolleary/PubSubClient@^2.8
    ; Sensors
    adafruit/DHT sensor library@^1.4.4
    adafruit/Adafruit Unified Sensor@^1.1.9
    adafruit/Adafruit BMP280 Library@^2.6.6
    claws/BH1750@^1.3.0
    ; JSON handling
    bblanchon/ArduinoJson@^6.21.3
    ; Time management
    paulstoffregen/Time@^1.6.1
    ; OTA updates
    ; Built-in ArduinoOTA
    ; WiFi Manager
    tzapu/WiFiManager@^2.0.16-rc.2
    ; File system
    ; Built-in SPIFFS/LittleFS
    ; Utilities
    thijse/ArduinoLog@^1.1.1

build_flags =
    -D VERSION=1.0.0
    -D BUILD_TIMESTAMP=$UNIX_TIME
    -D MQTT_MAX_PACKET_SIZE=512
    -D ARDUINOJSON_ENABLE_PROGMEM=1
    -D LOG_LEVEL=LOG_LEVEL_INFO
    ; Optimization
    -O2
    -Wall
    -Wextra

monitor_speed = 115200
monitor_filters = 
    colorize
    time
    default

upload_speed = 921600

; ========================================
; ESP32-S3 Sense (Recommended - with camera & TinyML)
; ========================================
[env:esp32s3]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = partitions.csv

; Enable PSRAM (2MB on ESP32-S3 Sense)
board_build.arduino.memory_type = qio_opi_psram

; Camera support (OV2640 on ESP32-S3 Sense)
build_flags = 
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DCONFIG_CAMERA_MODEL_ESP32S3_EYE
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps = 
    ${common.lib_deps}
    espressif/esp32-camera@^2.0.4

monitor_speed = 115200
upload_speed = 921600

; ========================================
; ESP32 Development Board (Generic)
; ========================================
[env:esp32dev]
platform = espressif32@^6.4.0
board = esp32dev
framework = arduino

lib_deps = ${common.lib_deps}
build_flags = 
    ${common.build_flags}
    -D ESP32
    -D ARDUINO_ARCH_ESP32
    ; Enable PSRAM
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
; Exclude TinyML and backup source files — only compile main.cpp
build_src_filter = +<main.cpp>

monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
upload_speed = ${common.upload_speed}

; Partition scheme for OTA
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; ========================================
; ESP32 Production (with optimizations)
; ========================================
[env:esp32prod]
extends = env:esp32dev
build_type = release
build_flags = 
    ${env:esp32dev.build_flags}
    -D NDEBUG
    -D LOG_LEVEL=LOG_LEVEL_WARNING
    -Os
    ; Strip symbols
    -s

; ========================================
; ESP8266 (NodeMCU / Wemos D1 Mini)
; ========================================
[env:esp8266]
platform = espressif8266@^4.2.1
board = nodemcuv2
framework = arduino

lib_deps = ${common.lib_deps}
build_flags = 
    ${common.build_flags}
    -D ESP8266
    -D ARDUINO_ARCH_ESP8266
    ; Increase HTTP client timeout
    -D HTTP_TIMEOUT=30000

monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
upload_speed = ${common.upload_speed}

board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld

; ========================================
; ESP32-S2 (USB native)
; ========================================
[env:esp32s2]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino

lib_deps = ${common.lib_deps}
build_flags = 
    ${common.build_flags}
    -D ESP32S2

monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}

; ========================================
; ESP32-C3 (RISC-V)
; ========================================
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

lib_deps = ${common.lib_deps}
build_flags = 
    ${common.build_flags}
    -D ESP32C3

monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}

; ========================================
; Testing environment (native)
; ========================================
[env:native]
platform = native
build_flags = 
    -D UNIT_TEST
    -std=c++17
    -lgtest
    -lpthread

test_framework = googletest
test_build_src = yes

; ========================================
; OTA Update environment
; ========================================
[env:esp32_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.1.100  ; Update with your device IP
upload_flags =
    --port=3232
    --auth=smart_farming_ota_password

; ========================================
; Debug environment with debug symbols
; ========================================
[env:esp32_debug]
extends = env:esp32dev
build_type = debug
build_flags = 
    ${env:esp32dev.build_flags}
    -D DEBUG=1
    -D LOG_LEVEL=LOG_LEVEL_VERBOSE
    -Og
    -g3
    -ggdb3

debug_tool = esp-prog
debug_init_break = tbreak setup

; ========================================
; Advanced configurations
; ========================================

; Custom partition table
[env:esp32_custom_partitions]
extends = env:esp32dev
board_build.partitions = custom_partitions.csv
